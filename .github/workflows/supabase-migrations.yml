name: Deploy Supabase migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # Verified session pooler for this project; port 5432 supports IPv4.
      SUPABASE_DB_HOST: aws-0-ap-south-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret $name"
              exit 1
            fi
          done
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Link production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Configure IPv4 session connection
        shell: python
        run: |
          import os
          from urllib.parse import quote

          project = os.environ["SUPABASE_PROJECT_ID"]
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          host = os.environ["SUPABASE_DB_HOST"]
          url = f"postgresql://postgres.{project}:{password}@{host}:5432/postgres?sslmode=require"
          # Mask the complete URL before passing it to later CLI steps.
          print(f"::add-mask::{url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"SUPABASE_DB_URL={url}\n")
      - name: Preview pending migrations
        run: supabase db push --remote="$SUPABASE_DB_URL" --dry-run
      - name: Apply pending migrations
        run: supabase db push --remote="$SUPABASE_DB_URL" --yes
